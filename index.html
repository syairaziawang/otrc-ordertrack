function formatPhone(raw,prefix='673'){
  const d=String(raw??'').replace(/[^0-9]/g,'');
  if(!d) return '';
  const s=d.replace(/^0+/,'');
  return prefix&&!s.startsWith(prefix)?prefix+s:s;
}
function buildOrderText(orders){
  return (orders||[]).map((o,i)=>{
    const p=[];
    if(o.colour) p.push(`Colour: ${o.colour}`);
    if(o.size)   p.push(`Size: ${o.size}`);
    if(o.style)  p.push(`Style: ${o.style}`);
    return `  ${i+1}. ${p.join(' | ')}`;
  }).join('\n');
}
function buildMsg(tmpl,c){
  return tmpl.replace(/{name}/g,c.name).replace(/{phone}/g,c.phone||'')
    .replace(/{orders}/g,buildOrderText(c.orders)).replace(/{count}/g,String((c.orders||[]).length));
}

async function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=e=>{
      const img=new window.Image();
      img.onload=()=>{
        const MAX=900,canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ══ SUPABASE DATA LAYER ══════════════════════════════════════════════ */
async function dbLoadAll(){
  const [{data:cust,error:e1},{data:tmpl,error:e2}] = await Promise.all([
    sb.from('customers').select('*').order('created_at',{ascending:false}),
    sb.from('app_templates').select('*'),
  ]);
  if(e1) throw e1;
  const templates={...DEFAULT_TEMPLATES};
  (tmpl||[]).forEach(r=>{templates[r.key]=r.content;});
  return {customers:cust||[],templates};
}

async function dbInsertCustomers(rows){
  const {error}=await sb.from('customers').insert(rows);
  if(error) throw error;
}

async function dbUpdateCustomer(id,updates){
  const {error}=await sb.from('customers').update({...updates,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) throw error;
}

async function dbDeleteCustomer(id){
  // Remove proof from storage first
  await sb.storage.from('proofs').remove([`${id}/proof.jpg`]).catch(()=>{});
  const {error}=await sb.from('customers').delete().eq('id',id);
  if(error) throw error;
}

async function dbUploadProof(customerId,file){
  const dataUrl=await compressImage(file);
  const blob=await fetch(dataUrl).then(r=>r.blob());
  const path=`${customerId}/proof.jpg`;
  const {error}=await sb.storage.from('proofs').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error) throw error;
  const {data}=sb.storage.from('proofs').getPublicUrl(path);
  return data.publicUrl;
}

async function dbSaveTemplates(templates){
  const rows=Object.entries(templates).map(([key,content])=>({key,content}));
  const {error}=await sb.from('app_templates').upsert(rows,{onConflict:'key'});
  if(error) throw error;
}

function LoginView(){

  const [password,setPassword]=useState('');
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');

  async function handleLogin(){
    if(!email||!password){setError('Please enter your email and password.');return;}
    setLoading(true);setError('');
    const {error:err}=await sb.auth.signInWithPassword({email,password});
    if(err){setError(err.message);setLoading(false);}
  }

  const inputSt={width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'12px 14px',borderRadius:8,fontFamily:'inherit',fontSize:14,outline:'none',transition:'border-color 0.2s'};
  const labelSt={display:'block',fontSize:11,fontWeight:600,color:C.textMid,marginBottom:5,textTransform:'uppercase',letterSpacing:'0.8px'};

  return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{width:'100%',maxWidth:400}}>
        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontSize:40,fontWeight:700,color:C.text,marginBottom:4}}>
            <span style={{color:C.peach}}>●</span> OrderTrack
          </div>
          <div style={{fontSize:12,color:C.textDim}}>Order management for your team</div>
        </div>

        {/* Card */}
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:40,boxShadow:'0 8px 40px rgba(60,40,20,0.12)'}}>
          <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontSize:22,fontWeight:700,color:C.text,marginBottom:24}}>Sign in to your account</div>

          {error&&(
            <div style={{background:'#fee2e2',border:'1px solid #fca5a5',color:'#991b1b',padding:'10px 14px',borderRadius:8,fontSize:12,marginBottom:18,display:'flex',alignItems:'center',gap:8}}>
              <IAlert size={14} color="#991b1b"/> {error}
            </div>
          )}

          <div style={{marginBottom:16}}>
            <label style={labelSt}>Email address</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&handleLogin()} placeholder="you@company.com" style={inputSt}/>
          </div>

          <div style={{marginBottom:28}}>

              onKeyDown={e=>e.key==='Enter'&&handleLogin()} placeholder="••••••••" style={inputSt}/>

          </button>

          <div style={{fontSize:11,color:C.textDim,textAlign:'center',marginTop:20,lineHeight:1.6}}>

           (statusFilter==='all'||c.status===statusFilter);

  function exportCSV(){
    const rows=[['Name','Phone','Items','Colours','Sizes','Styles','Status','Notes','Added']];
    customers.forEach(c=>rows.push([
      c.name,`+${c.phone}`,(c.orders||[]).length,
      [...new Set((c.orders||[]).map(o=>o.colour).filter(Boolean))].join('; '),
      [...new Set((c.orders||[]).map(o=>o.size).filter(Boolean))].join('; '),
      [...new Set((c.orders||[]).map(o=>o.style).filter(Boolean))].join('; '),
      STATUSES[c.status]?.label,c.notes||'',fmtDate(c.created_at),
    ]));
    const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));

            <div style={{fontSize:12}}>{customers.length===0?'Go to Import to upload your Excel file':'Try adjusting your search or filter'}</div>
          </div>
        ):(
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr style={{background:C.bg2}}>
                  {['Customer','Phone','Items','Status','Send Invoice','Send Pickup','Added',''].map(h=>(
                    <th key={h} style={{padding:'10px 14px',textAlign:'left',fontSize:10,fontWeight:600,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((c,i)=>{
                  const invMsg=buildMsg(templates.invoice,c);
                  const rdyMsg=buildMsg(templates.ready,c);
                  const canPickup=['paid','ready','collected'].includes(c.status);
                  const rowBg=i%2===0?C.card:C.surface;
                  return (
                    <tr key={c.id} style={{borderBottom:`1px solid ${C.border}`,background:rowBg,cursor:'pointer',transition:'background 0.12s'}}
                      onMouseEnter={e=>e.currentTarget.style.background=C.terraDim}
                      onMouseLeave={e=>e.currentTarget.style.background=rowBg}
                      onClick={()=>onOpenDetail(c.id)}>
                      <td style={{padding:'11px 14px',fontWeight:600,color:C.text}}>{c.name}</td>
                      <td style={{padding:'11px 14px',color:C.textMid,fontFamily:'monospace',fontSize:12}}>{c.phone?`+${c.phone}`:'—'}</td>
                      <td style={{padding:'11px 14px',color:C.textMid,textAlign:'center'}}>{(c.orders||[]).length}</td>
                      <td style={{padding:'11px 14px'}}><StatusBadge status={c.status}/></td>
                      <td style={{padding:'11px 14px'}} onClick={e=>e.stopPropagation()}>
                        <a href={c.phone?waLink(c.phone,invMsg):'#'} target="_blank" rel="noopener"
                          onClick={()=>{if(c.status==='new')onUpdateCustomer(c.id,{status:'invoice_sent',status_history:[...(c.status_history||[]),{status:'invoice_sent',date:new Date().toISOString()}]});}}
                          style={{display:'inline-flex',alignItems:'center',gap:4,background:'#25D366',color:'#fff',borderRadius:6,padding:'4px 10px',fontSize:11,fontWeight:600,textDecoration:'none',opacity:c.phone?1:0.4,pointerEvents:c.phone?'auto':'none'}}>
                          <ISend size={9}/> Send
                        </a>
                      </td>
                      <td style={{padding:'11px 14px'}} onClick={e=>e.stopPropagation()}>
                        {canPickup
                          ?<a href={waLink(c.phone,rdyMsg)} target="_blank" rel="noopener"
                              style={{display:'inline-flex',alignItems:'center',gap:4,background:'#25D366',color:'#fff',borderRadius:6,padding:'4px 10px',fontSize:11,fontWeight:600,textDecoration:'none'}}>
                              <IBox size={9}/> Send
                            </a>
                          :<span style={{color:C.textDim,fontSize:11}}>—</span>}
                      </td>
                      <td style={{padding:'11px 14px',color:C.textDim,fontSize:11,whiteSpace:'nowrap'}}>{fmtDate(c.created_at)}</td>
                      <td style={{padding:'11px 14px'}} onClick={e=>e.stopPropagation()}>
                        <button onClick={()=>{if(confirm(`Delete ${c.name}?`))onDelete(c.id);}}
                          style={{background:'transparent',border:'none',cursor:'pointer',color:C.textDim,padding:4,borderRadius:4,display:'flex',alignItems:'center'}}>
                          <ITrash size={13}/>
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {filtered.length>0&&<div style={{fontSize:11,color:C.textDim,marginTop:10,textAlign:'right'}}>Showing {filtered.length} of {customers.length} customers</div>}
    </div>
  );
}

/* ══ IMPORT VIEW ══════════════════════════════════════════════════════ */
function ImportView({onImport,onBack}){
  const [step,setStep]=useState('upload');
  const [headers,setHeaders]=useState([]);
  const [rawRows,setRawRows]=useState([]);
  const [colMap,setColMap]=useState({name:'',phone:'',colour:'',size:'',style:''});
  const [prefix,setPrefix]=useState('673');
  const [drag,setDrag]=useState(false);
  const [importing,setImporting]=useState(false);
  const [importMode,setImportMode]=useState('update_orders');
  const fileRef=useRef();
  const FIELDS=[
    {key:'name',label:'Customer Name ✱'},{key:'phone',label:'Phone Number ✱'},
    {key:'colour',label:'Shirt Colour'},{key:'size',label:'Size'},{key:'style',label:'Style / Sleeve'},
  ];
  const MODES=[
    {id:'update_orders',label:'Update existing orders',desc:'Replaces order items for existing customers. Keeps their status, notes & payment proof. Best for correcting mistakes.',recommended:true},
    {id:'add_new',label:'Add new customers only',desc:'Skips anyone already in the system. Only adds brand new phone numbers. Safe top-up.',recommended:false},
    {id:'merge_orders',label:'Add orders on top',desc:'Appends new order rows to existing customers. Use when customers have genuinely ordered additional items.',recommended:false},
  ];
  function autoIdx(key,hdrs){
    return hdrs.findIndex(h=>{
      const l=h.toLowerCase();
      if(key==='name')   return l.includes('name');
      if(key==='phone')  return l.includes('phone')||l.includes('mobile')||l.includes('no')||l.includes('number');
      if(key==='colour') return l.includes('colour')||l.includes('color');
      if(key==='size')   return l.includes('size');
      if(key==='style')  return l.includes('style')||l.includes('sleeve');
      return false;
    });
  }
  function handleFile(file){
    if(!file) return;
    const reader=new FileReader();
    reader.onerror=()=>alert('Could not read this file.');
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!json.length||!json[0]?.some(c=>c)){alert('No header row found.');return;}
        const hdrs=json[0].map(h=>String(h??'').trim());
        const rows=json.slice(1).filter(r=>r.some(c=>String(c).trim()));
        setHeaders(hdrs);setRawRows(rows);
        const auto={};
        FIELDS.forEach(f=>{const idx=autoIdx(f.key,hdrs);auto[f.key]=idx>=0?String(idx):'';});
        setColMap(auto);setStep('map');
      }catch(err){alert('Parse error: '+err.message);}
    };
    reader.readAsBinaryString(file);
  }
  async function doImport(){
    if(!colMap.name||!colMap.phone){alert('Name and Phone columns are required.');return;}
    setImporting(true);
    const groups={};
    rawRows.forEach(row=>{
      const phone=formatPhone(String(row[parseInt(colMap.phone)]??''),prefix);
      const name=String(row[parseInt(colMap.name)]??'').trim()||'Unknown';
      const key=phone||name;
      if(!groups[key]) groups[key]={name,phone,orders:[]};
      const o={};
      if(colMap.colour) o.colour=String(row[parseInt(colMap.colour)]??'').trim();
      if(colMap.size)   o.size  =String(row[parseInt(colMap.size)]  ??'').trim();
      if(colMap.style)  o.style =String(row[parseInt(colMap.style)] ??'').trim();
      groups[key].orders.push(o);
    });
    await onImport(Object.values(groups),importMode);
    setImporting(false);
  }
  return (
    <div style={{maxWidth:700,margin:'0 auto',padding:'24px 20px 80px'}}>
      <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'none',cursor:'pointer',color:C.textMid,fontFamily:'inherit',fontSize:13,marginBottom:20,padding:0}}><IBack size={14}/> Back</button>
      <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontSize:32,fontWeight:700,color:C.text,marginBottom:4}}>Import Orders</div>
      <div style={{fontSize:12,color:C.textDim,marginBottom:24}}>Upload Excel or CSV. Rows with the same phone number are grouped into one customer.</div>
      {step==='upload'&&(
        <Card>
          <input type="file" ref={fileRef} accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          <div style={{border:`1.5px dashed ${drag?C.terra:C.border2}`,borderRadius:12,padding:'52px 24px',textAlign:'center',cursor:'pointer',background:drag?C.terraDim:C.bg2,transition:'all 0.2s'}}
            onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
            onClick={()=>fileRef.current.click()}>
            <IUpload size={32} style={{margin:'0 auto 12px',color:C.textDim}}/>
            <div style={{fontWeight:700,fontSize:16,color:C.text,marginBottom:4}}>Drop your file here or click to browse</div>
            <div style={{fontSize:11,color:C.textDim}}>.xlsx · .xls · .csv</div>
          </div>
        </Card>
      )}
      {step==='map'&&(
        <Card>
          <SecTitle>Map Your Columns</SecTitle>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:12,marginBottom:20}}>
            {FIELDS.map(f=>(
              <div key={f.key}>
                <div style={{fontSize:10,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,fontWeight:600,marginBottom:5}}>{f.label}</div>
                <select value={colMap[f.key]} onChange={e=>setColMap({...colMap,[f.key]:e.target.value})}
                  style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,color:C.text,padding:'8px 10px',borderRadius:8,fontFamily:'inherit',fontSize:12,cursor:'pointer',outline:'none'}}>
                  <option value="">— skip —</option>
                  {headers.map((h,i)=><option key={i} value={String(i)}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10,paddingTop:14,borderTop:`1px solid ${C.border}`,marginBottom:20,flexWrap:'wrap'}}>
            <span style={{fontSize:12,color:C.textMid,fontWeight:500}}>Country code prefix:</span>
            <input value={prefix} onChange={e=>setPrefix(e.target.value.replace(/\D/g,''))} maxLength={5}
              style={{width:80,background:C.card,border:`1px solid ${C.border}`,color:C.text,padding:'7px 10px',borderRadius:8,fontFamily:'monospace',fontSize:13,outline:'none'}}/>
            <span style={{fontSize:11,color:C.textDim}}>Brunei: 673 · Singapore: 65 · Malaysia: 60</span>
          </div>
          <div style={{paddingTop:14,borderTop:`1px solid ${C.border}`,marginBottom:20}}>
            <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,marginBottom:10}}>If a customer already exists (matched by phone)</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {MODES.map(m=>(
                <div key={m.id} onClick={()=>setImportMode(m.id)}
                  style={{display:'flex',alignItems:'flex-start',gap:12,padding:'12px 14px',borderRadius:10,border:`1.5px solid ${importMode===m.id?C.terra:C.border}`,background:importMode===m.id?C.terraDim:C.surface,cursor:'pointer',transition:'all 0.15s'}}>
                  <div style={{width:16,height:16,borderRadius:'50%',border:`2px solid ${importMode===m.id?C.terra:C.border}`,background:importMode===m.id?C.terra:'transparent',flexShrink:0,marginTop:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {importMode===m.id&&<div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/>}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
                      <span style={{fontSize:13,fontWeight:600,color:C.text}}>{m.label}</span>
                      {m.recommended&&<span style={{fontSize:9,fontWeight:700,background:C.sage,color:'#fff',padding:'1px 7px',borderRadius:20,letterSpacing:'0.5px',textTransform:'uppercase'}}>Recommended</span>}
                    </div>
                    <div style={{fontSize:11,color:C.textDim,lineHeight:1.5}}>{m.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,marginBottom:8}}>Preview — first 3 rows</div>
          <div style={{overflowX:'auto',borderRadius:8,border:`1px solid ${C.border}`,marginBottom:20}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
              <thead><tr style={{background:C.bg2}}>{['Name','Phone','Colour','Size','Style'].map(h=><th key={h} style={{padding:'7px 12px',textAlign:'left',color:C.textDim,fontWeight:600,fontSize:10,textTransform:'uppercase',letterSpacing:'0.8px',borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
              <tbody>{rawRows.slice(0,3).map((row,i)=>(
                <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                  {['name','phone','colour','size','style'].map(k=>(
                    <td key={k} style={{padding:'7px 12px',color:C.textMid}}>{colMap[k]!==''?String(row[parseInt(colMap[k])]??''):'—'}</td>
                  ))}
                </tr>
              ))}</tbody>
            </table>
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn variant="terra" onClick={doImport} disabled={importing}>
              {importing?<><Spinner/> Importing…</>:<><IUpload size={13}/> Import {rawRows.length} rows</>}
            </Btn>
            <Btn variant="ghost" onClick={()=>setStep('upload')}><IBack size={13}/> Back</Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

/* ══ DETAIL VIEW ══════════════════════════════════════════════════════ */
function DetailView({customer:c,templates,onBack,onUpdate,onUploadProof,onRemoveProof,showToast}){
  const [notes,setNotes]        =useState(c.notes||'');
  const [editNotes,setEditNotes]=useState(false);
  const [copied,setCopied]      =useState(null);
  const [proofUploading,setPU]  =useState(false);
  const fileRef=useRef();

  useEffect(()=>{setNotes(c.notes||'');},[c.id,c.notes]);

  const invMsg=buildMsg(templates.invoice,c);
  const rdyMsg=buildMsg(templates.ready,c);
  const sIdx  =STATUS_ORDER.indexOf(c.status);

  function copy(msg,key){navigator.clipboard.writeText(msg).catch(()=>{});setCopied(key);setTimeout(()=>setCopied(null),2000);}

  async function handleProof(e){
    const file=e.target.files[0];if(!file) return;
    if(file.size>8*1024*1024){showToast('Image must be under 8MB','error');return;}
    setPU(true);
    try{
      const url=await onUploadProof(c.id,file);
      await onUpdate({payment_proof_url:url,payment_proof_at:new Date().toISOString()});
      showToast('Payment proof saved');
    }catch(err){showToast('Upload failed: '+err.message,'error');}
    setPU(false);
  }

  async function removeProof(){
    if(!confirm('Remove payment proof?')) return;
    await onRemoveProof(c.id);
    await onUpdate({payment_proof_url:null,payment_proof_at:null});
    showToast('Proof removed');
  }

  function advance(){
    const next=STATUS_NEXT[c.status];if(!next) return;
    const history=[...(c.status_history||[]),{status:next,date:new Date().toISOString()}];
    onUpdate({status:next,status_history:history});
    showToast(`Status → ${STATUSES[next].label}`);
  }

  return (
    <div style={{maxWidth:880,margin:'0 auto',padding:'22px 20px 80px'}}>
      <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'none',cursor:'pointer',color:C.textMid,fontFamily:'inherit',fontSize:13,marginBottom:18,padding:0}}><IBack size={14}/> Back to dashboard</button>

      {/* Header */}
      <Card>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:14,marginBottom:20}}>
          <div>
            <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontSize:32,fontWeight:700,color:C.text,lineHeight:1}}>{c.name}</div>
            <div style={{color:C.textDim,fontSize:12,marginTop:5,fontFamily:'monospace'}}>{c.phone?`+${c.phone}`:'No phone on file'}</div>
            <div style={{marginTop:10}}><StatusBadge status={c.status}/></div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8,alignItems:'flex-end'}}>
            {STATUS_NEXT[c.status]&&<Btn variant="terra" onClick={advance}><ICheck2 size={13}/> {STATUS_NEXT_LABEL[c.status]}</Btn>}
            <div style={{fontSize:10,color:C.textDim}}>Added {fmtDate(c.created_at)}</div>
          </div>
        </div>
        {/* Timeline */}
        <div style={{paddingTop:16,borderTop:`1px solid ${C.border}`}}>
          <div style={{display:'flex',alignItems:'center',overflowX:'auto',paddingBottom:4}}>
            {STATUS_ORDER.map((s,i)=>{
              const done=i<sIdx,active=i===sIdx,cfg=STATUSES[s];
              return (
                <div key={s} style={{display:'flex',alignItems:'center',flex:i<STATUS_ORDER.length-1?1:'none'}}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',minWidth:72}}>
                    <div style={{width:26,height:26,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:done||active?cfg.color:C.bg2,border:`2px solid ${done||active?cfg.color:C.border}`,transition:'all 0.3s'}}>
                      {done?<ICheck size={11} color="#fff"/>:<span style={{width:7,height:7,borderRadius:'50%',background:active?'#fff':C.border}}/>}
                    </div>
                    <div style={{fontSize:9,color:active?cfg.color:C.textDim,fontWeight:active?700:400,marginTop:4,textAlign:'center',lineHeight:1.3,maxWidth:66}}>{cfg.label}</div>
                  </div>
                  {i<STATUS_ORDER.length-1&&<div style={{flex:1,height:2,background:i<sIdx?STATUSES[STATUS_ORDER[i+1]].color:C.border,margin:'0 3px',marginBottom:16,transition:'all 0.3s'}}/>}
                </div>
              );
            })}
          </div>
        </div>
      </Card>

      {/* Order Items */}
      <Card>
        <SecTitle icon={IBox}>Order Items ({(c.orders||[]).length})</SecTitle>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {(c.orders||[]).map((o,i)=>(
            <div key={i} style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:10,padding:'10px 14px',fontSize:12,color:C.textMid,minWidth:110}}>
              <div style={{fontWeight:700,color:C.text,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:5}}>Item {i+1}</div>
              {o.colour&&<div style={{marginBottom:2}}>🎨 {o.colour}</div>}
              {o.size  &&<div style={{marginBottom:2}}>📐 {o.size}</div>}
              {o.style &&<div>👕 {o.style}</div>}
            </div>
          ))}
        </div>
      </Card>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:14}}>
        {/* Invoice WA */}
        <Card sx={{marginBottom:0}}>
          <SecTitle icon={IFile}>Invoice Message</SecTitle>
          <div style={{background:C.bg,border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.sage}`,borderRadius:'0 8px 8px 0',padding:'11px 13px',fontSize:11,lineHeight:1.85,color:C.textMid,whiteSpace:'pre-wrap',fontFamily:'monospace',maxHeight:140,overflowY:'auto',marginBottom:12}}>{invMsg}</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <Btn variant="wa" small href={c.phone?waLink(c.phone,invMsg):'#'} target="_blank" rel="noopener"
              onClick={()=>c.status==='new'&&onUpdate({status:'invoice_sent',status_history:[...(c.status_history||[]),{status:'invoice_sent',date:new Date().toISOString()}]})}>
              <ISend size={11}/> Open WhatsApp
            </Btn>
            <Btn variant="ghost" small onClick={()=>copy(invMsg,'inv')}>{copied==='inv'?<><ICheck size={11}/> Copied!</>:<><ICopy size={11}/> Copy</>}</Btn>
          </div>
        </Card>

        {/* Ready WA */}
        <Card sx={{marginBottom:0}}>
          <SecTitle icon={IBox}>Ready for Pickup</SecTitle>
          <div style={{background:C.bg,border:`1px solid ${C.border}`,borderLeft:'3px solid #6BA4C9',borderRadius:'0 8px 8px 0',padding:'11px 13px',fontSize:11,lineHeight:1.85,color:C.textMid,whiteSpace:'pre-wrap',fontFamily:'monospace',maxHeight:140,overflowY:'auto',marginBottom:12}}>{rdyMsg}</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <Btn variant="wa" small href={c.phone?waLink(c.phone,rdyMsg):'#'} target="_blank" rel="noopener"><IBox size={11}/> Open WhatsApp</Btn>
            <Btn variant="ghost" small onClick={()=>copy(rdyMsg,'rdy')}>{copied==='rdy'?<><ICheck size={11}/> Copied!</>:<><ICopy size={11}/> Copy</>}</Btn>
          </div>
        </Card>

        {/* Payment Proof */}
        <Card sx={{marginBottom:0}}>
          <SecTitle icon={IImg}>Payment Proof</SecTitle>
          <input type="file" ref={fileRef} accept="image/*" style={{display:'none'}} onChange={handleProof}/>
          {proofUploading?(
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'24px 0',color:C.textDim,fontSize:12}}><Spinner/> Uploading…</div>
          ):c.payment_proof_url?(
            <div>
              <img src={c.payment_proof_url} alt="Payment proof" style={{width:'100%',maxHeight:200,objectFit:'contain',borderRadius:8,border:`1px solid ${C.border}`,background:C.bg2,marginBottom:10}}/>
              {c.payment_proof_at&&<div style={{fontSize:10,color:C.textDim,marginBottom:10}}>Uploaded {fmtDate(c.payment_proof_at)}</div>}
              <div style={{display:'flex',gap:8}}>
                <Btn variant="ghost" small onClick={()=>fileRef.current.click()}><IUpload size={11}/> Replace</Btn>
                <Btn variant="danger" small onClick={removeProof}><IX size={11}/> Remove</Btn>
              </div>
            </div>
          ):(
            <div>
              <div style={{border:`1.5px dashed ${C.border}`,borderRadius:10,padding:'28px 16px',textAlign:'center',background:C.bg2,marginBottom:10,cursor:'pointer'}} onClick={()=>fileRef.current.click()}>
                <IImg size={22} style={{margin:'0 auto 8px',color:C.textDim}}/>
                <div style={{fontSize:12,color:C.textDim}}>Click to upload screenshot</div>
                <div style={{fontSize:10,color:C.textDim,marginTop:2}}>Auto-compressed · stored securely</div>
              </div>
              <Btn variant="terra" small onClick={()=>fileRef.current.click()}><IUpload size={11}/> Upload Proof</Btn>
            </div>
          )}
        </Card>

        {/* Notes */}
        <Card sx={{marginBottom:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:14,color:C.text,display:'flex',alignItems:'center',gap:8}}><IEdit size={15} color={C.textMid}/> Notes</div>
            {!editNotes&&<Btn variant="ghost" small onClick={()=>setEditNotes(true)}><IEdit size={11}/> Edit</Btn>}
          </div>
          {editNotes?(
            <div>
              <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Internal notes about this order…"
                style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'10px 12px',borderRadius:8,fontFamily:'inherit',fontSize:12,lineHeight:1.7,resize:'vertical',minHeight:100,outline:'none',marginBottom:10}}/>
              <div style={{display:'flex',gap:8}}>
                <Btn variant="terra" small onClick={()=>{onUpdate({notes});setEditNotes(false);showToast('Notes saved');}}><ICheck size={11}/> Save</Btn>
                <Btn variant="ghost" small onClick={()=>{setNotes(c.notes||'');setEditNotes(false);}}><IX size={11}/> Cancel</Btn>
              </div>
            </div>
          ):(
            <div style={{fontSize:12,color:c.notes?C.textMid:C.textDim,lineHeight:1.75,background:C.bg,borderRadius:8,padding:'10px 12px',minHeight:60}}>{c.notes||'No notes yet. Click Edit to add.'}</div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ══ TEMPLATES VIEW ══════════════════════════════════════════════════ */
function TemplatesView({templates,onSave,onBack}){
  const [tmpl,setTmpl]=useState({...templates});
  const [saving,setSaving]=useState(false);
  const TAGS=['{name}','{phone}','{orders}','{count}'];
  const ITEMS=[{key:'invoice',label:'Invoice / Confirmation Message',accent:C.sage},{key:'ready',label:'Ready for Pickup Message',accent:'#6BA4C9'}];
  async function doSave(){setSaving(true);await onSave(tmpl);setSaving(false);}
  return (
    <div style={{maxWidth:700,margin:'0 auto',padding:'22px 20px 80px'}}>
      <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'none',cursor:'pointer',color:C.textMid,fontFamily:'inherit',fontSize:13,marginBottom:18,padding:0}}><IBack size={14}/> Back</button>
      <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontSize:32,fontWeight:700,color:C.text,marginBottom:4}}>Message Templates</div>
      <div style={{fontSize:12,color:C.textDim,marginBottom:24}}>Changes here apply to all users immediately.</div>
      {ITEMS.map(t=>(
        <Card key={t.key} sx={{borderTop:`3px solid ${t.accent}`}}>
          <div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:12}}>{t.label}</div>
          <textarea value={tmpl[t.key]} onChange={e=>setTmpl(p=>({...p,[t.key]:e.target.value}))}
            style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,color:C.text,padding:'12px 14px',borderRadius:8,fontFamily:'monospace',fontSize:12,lineHeight:1.8,resize:'vertical',minHeight:160,outline:'none',marginBottom:10}}/>
          <div style={{fontSize:11,color:C.textDim}}>Insert: &nbsp;{TAGS.map(tag=>(
            <span key={tag} onClick={()=>setTmpl(p=>({...p,[t.key]:p[t.key]+tag}))}
              style={{display:'inline-block',background:C.sagePale,color:'#3D6B3A',border:`1px solid ${C.sage}44`,padding:'1px 8px',borderRadius:20,fontSize:10,cursor:'pointer',margin:'2px',fontWeight:600}}>{tag}</span>
          ))}</div>
        </Card>
      ))}
      <div style={{display:'flex',gap:10}}>
        <Btn variant="terra" onClick={doSave} disabled={saving}>{saving?<><Spinner/> Saving…</>:<><ICheck size={13}/> Save Templates</>}</Btn>
        <Btn variant="ghost" onClick={onBack}><IX size={13}/> Discard</Btn>
      </div>
    </div>
  );
}

/* ══ MAIN APP (authenticated) ════════════════════════════════════════ */
function MainApp({session}){
  const [customers, setCustomers]=useState([]);
  const [templates, setTemplates]=useState(DEFAULT_TEMPLATES);
  const [view,      setView]     =useState('dashboard');
  const [selectedId,setSelectedId]=useState(null);
  const [search,    setSearch]   =useState('');
  const [statusFilter,setStatusFilter]=useState('all');
  const [loading,   setLoading]  =useState(true);
  const [refreshing,setRefreshing]=useState(false);
  const [toast,     setToast]    =useState(null);

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const loadAll=useCallback(async(quiet=false)=>{
    if(!quiet) setLoading(true); else setRefreshing(true);
    try{
      const {customers:c,templates:t}=await dbLoadAll();
      setCustomers(c); setTemplates(t);
    }catch(err){showToast('Failed to load data: '+err.message,'error');}
    setLoading(false); setRefreshing(false);
  },[]);

  useEffect(()=>{
    loadAll();
    // Real-time subscription
    const channel=sb.channel('realtime-customers')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'customers'},(p)=>{
        setCustomers(prev=>[p.new,...prev.filter(c=>c.id!==p.new.id)]);
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'customers'},(p)=>{
        setCustomers(prev=>prev.map(c=>c.id===p.new.id?p.new:c));
      })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'customers'},(p)=>{
        setCustomers(prev=>prev.filter(c=>c.id!==p.old.id));
      })
      .subscribe();
    return ()=>sb.removeChannel(channel);
  },[]);

  async function handleImport(groups,mode='update_orders'){
    try{
      const toInsert=[],toUpdate=[];
      groups.forEach(g=>{
        const ex=customers.find(c=>c.phone&&c.phone===g.phone);
        if(ex){
          if(mode==='add_new'){
            // skip — customer already exists
          } else if(mode==='update_orders'){
            // replace orders, keep status/notes/proof
            toUpdate.push({id:ex.id,orders:g.orders});
          } else {
            // merge_orders — append new rows on top
            toUpdate.push({id:ex.id,orders:[...(ex.orders||[]),...g.orders]});
          }
        } else {
          toInsert.push({name:g.name,phone:g.phone,orders:g.orders,status:'new',notes:'',status_history:[]});
        }
      });
      if(toInsert.length) await dbInsertCustomers(toInsert);
      for(const u of toUpdate) await dbUpdateCustomer(u.id,{orders:u.orders});
      const modeLabel=mode==='add_new'?'skipped existing':mode==='update_orders'?'orders updated':'orders merged';
      showToast(`${toInsert.length} new · ${toUpdate.length} ${modeLabel}`);
      setView('dashboard');
    }catch(err){showToast('Import failed: '+err.message,'error');}
  }

  async function handleUpdate(id,updates){
    try{
      await dbUpdateCustomer(id,updates);
      setCustomers(prev=>prev.map(c=>c.id===id?{...c,...updates,updated_at:new Date().toISOString()}:c));
    }catch(err){showToast('Update failed: '+err.message,'error');}
  }

  async function handleDelete(id){
    try{
      await dbDeleteCustomer(id);
      setCustomers(prev=>prev.filter(c=>c.id!==id));
      showToast('Customer deleted');
      if(selectedId===id) setView('dashboard');
    }catch(err){showToast('Delete failed: '+err.message,'error');}
  }

  async function handleUploadProof(customerId,file){
    return await dbUploadProof(customerId,file);
  }

  async function handleRemoveProof(customerId){
    await sb.storage.from('proofs').remove([`${customerId}/proof.jpg`]).catch(()=>{});
  }

  async function handleSaveTemplates(t){
    try{
      await dbSaveTemplates(t);
      setTemplates(t);
      showToast('Templates saved!');
      setView('dashboard');
    }catch(err){showToast('Save failed: '+err.message,'error');}
  }

  const selectedCustomer=customers.find(c=>c.id===selectedId);

  const NAV=[{id:'dashboard',label:'Dashboard'},{id:'import',label:'Import'},{id:'templates',label:'Templates'}];

  if(loading) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontSize:26,fontWeight:700,color:C.text,marginBottom:16}}>Loading…</div>
        <Spinner/>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:C.bg,color:C.text,fontFamily:'Jost,system-ui,sans-serif'}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>

      {/* Navbar */}
      <nav style={{background:C.text,display:'flex',alignItems:'center',padding:'0 20px',height:52,position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 16px rgba(0,0,0,0.2)'}}>
        <div style={{fontFamily:'Cormorant Garamond,Georgia,serif',fontWeight:700,fontSize:20,color:C.bg,marginRight:28,cursor:'pointer',flexShrink:0}} onClick={()=>setView('dashboard')}>
          <span style={{color:C.peach}}>●</span> OrderTrack
        </div>
        <div style={{display:'flex',gap:2}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setView(n.id)}
              style={{background:view===n.id?C.terraPale:'transparent',color:view===n.id?C.terra:'#A09080',border:'none',cursor:'pointer',padding:'6px 14px',borderRadius:6,fontFamily:'inherit',fontSize:13,fontWeight:view===n.id?600:400,transition:'all 0.15s'}}>
              {n.label}
            </button>
          ))}
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <span style={{fontSize:11,color:'#7A6D65',background:'#2C2420',padding:'4px 10px',borderRadius:20,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {fmtUser(session?.user?.email)}
          </span>
          <button onClick={()=>sb.auth.signOut()} title="Sign out"
            style={{background:'transparent',border:'none',cursor:'pointer',color:'#7A6D65',padding:4,display:'flex',alignItems:'center',borderRadius:6}}>
            <ILogout size={16}/>
          </button>
        </div>
      </nav>

      {/* Toast */}
      {toast&&(
        <div style={{position:'fixed',bottom:24,right:24,background:toast.type==='error'?'#7f1d1d':C.text,color:C.bg,padding:'11px 20px',borderRadius:10,fontSize:13,fontWeight:500,zIndex:999,boxShadow:'0 4px 24px rgba(0,0,0,0.22)',display:'flex',alignItems:'center',gap:8}}>
          {toast.type==='error'?<IAlert size={14}/>:<ICheck size={14} color={C.sage}/>}
          {toast.msg}
        </div>
      )}

      {view==='dashboard'&&<DashboardView customers={customers} templates={templates} search={search} setSearch={setSearch} statusFilter={statusFilter} setStatusFilter={setStatusFilter} onOpenDetail={id=>{setSelectedId(id);setView('detail');}} onDelete={handleDelete} onUpdateCustomer={handleUpdate} onRefresh={()=>loadAll(true)} refreshing={refreshing} showToast={showToast}/>}
      {view==='import'   &&<ImportView onBack={()=>setView('dashboard')} onImport={handleImport}/>}
      {view==='detail'   &&selectedCustomer&&<DetailView customer={selectedCustomer} templates={templates} onBack={()=>setView('dashboard')} onUpdate={u=>handleUpdate(selectedId,u)} onUploadProof={handleUploadProof} onRemoveProof={handleRemoveProof} showToast={showToast}/>}
      {view==='templates'&&<TemplatesView templates={templates} onBack={()=>setView('dashboard')} onSave={handleSaveTemplates}/>}
    </div>
  );
}

/* ══ APP ROOT (handles auth) ══════════════════════════════════════════ */
function App(){
  const [session,setSession]=useState(undefined); // undefined = loading

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setSession(session));
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setSession(session));
    return ()=>subscription.unsubscribe();
  },[]);

  if(session===undefined) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <Spinner/>
    </div>
  );
  if(!session) return <LoginView/>;
  return <MainApp session={session}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
