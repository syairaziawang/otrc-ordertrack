function formatPhone(raw,prefix='673'){
  const d=String(raw??'').replace(/[^0-9]/g,'');
  if(!d) return '';
  const s=d.replace(/^0+/,'');
  return prefix&&!s.startsWith(prefix)?prefix+s:s;
}
function buildOrderText(orders){
  return (orders||[]).map((o,i)=>{
    const p=[];
    if(o.colour) p.push(`Colour: ${o.colour}`);
    if(o.size)   p.push(`Size: ${o.size}`);
    if(o.style)  p.push(`Style: ${o.style}`);
    return `  ${i+1}. ${p.join(' | ')}`;
  }).join('\n');
}

}

async function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=e=>{
      const img=new window.Image();
      img.onload=()=>{
        const MAX=900,canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function dbLoadAll(){
  const [{data:cust,error:e1},{data:tmpl,error:e2}] = await Promise.all([
    sb.from('customers').select('*').order('created_at',{ascending:false}),
    sb.from('app_templates').select('*'),
  ]);
  if(e1) throw e1;
  const templates={...DEFAULT_TEMPLATES};
  (tmpl||[]).forEach(r=>{templates[r.key]=r.content;});
  return {customers:cust||[],templates};
}

async function dbInsertCustomers(rows){
  const {error}=await sb.from('customers').insert(rows);
  if(error) throw error;
}

async function dbUpdateCustomer(id,updates){
  const {error}=await sb.from('customers').update({...updates,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) throw error;
}

async function dbDeleteCustomer(id){
  // Remove proof from storage first
  await sb.storage.from('proofs').remove([`${id}/proof.jpg`]).catch(()=>{});
  const {error}=await sb.from('customers').delete().eq('id',id);
  if(error) throw error;
}

async function dbUploadProof(customerId,file){
  const dataUrl=await compressImage(file);
  const blob=await fetch(dataUrl).then(r=>r.blob());
  const path=`${customerId}/proof.jpg`;
  const {error}=await sb.storage.from('proofs').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error) throw error;
  const {data}=sb.storage.from('proofs').getPublicUrl(path);
  return data.publicUrl;
}

async function dbSaveTemplates(templates){
  const rows=Object.entries(templates).map(([key,content])=>({key,content}));
  const {error}=await sb.from('app_templates').upsert(rows,{onConflict:'key'});
  if(error) throw error;
}

/* ── Excel Export ── */
function exportToExcel(customers,expenses){
  const wb=XLSX.utils.book_new();

  // Orders sheet
  const ordRows=[['Customer','Phone','Items','Selling Price','Order Cost','Margin','Status','Date Added']];
  customers.forEach(c=>{
    const p=Number(c.price||0),cost=Number(c.cost||0);
    ordRows.push([c.name,c.phone?('+'+c.phone):'—',(c.orders||[]).length,p,cost,p-cost,STATUSES[c.status]?.label||c.status,fmtDate(c.created_at)]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ordRows),'Orders');

  // Expenses sheet
  const expRows=[['Date','Category','Description','Amount']];
  expenses.forEach(e=>expRows.push([e.date,e.category,e.description,Number(e.amount)]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(expRows),'Expenses');

  // Summary sheet
  const collected=customers.filter(c=>['paid','ready','collected'].includes(c.status));
  const invoiced =customers.filter(c=>c.status==='invoice_sent');
  const totalRev =collected.reduce((s,c)=>s+Number(c.price||0),0);
  const totalCost=customers.reduce((s,c)=>s+Number(c.cost||0),0);
  const totalExp =expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const outstanding=invoiced.reduce((s,c)=>s+Number(c.price||0),0);
  const sumRows=[
    ['Metric','Amount (BND)'],
    ['Total Revenue (Collected)',totalRev],
    ['Outstanding (Invoice Sent)',outstanding],
    ['Total Order Costs',totalCost],
    ['Total One-off Expenses',totalExp],
    ['Net Profit',totalRev-totalCost-totalExp],
  ];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sumRows),'Summary');
  XLSX.writeFile(wb,'ordertrack-finance.xlsx');
}

/* ══ LIGHTBOX ════════════════════════════════════════════════════════ */
function Lightbox({src,onClose}){
  useEffect(()=>{
    const esc=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',esc);
    return ()=>window.removeEventListener('keydown',esc);
  },[]);
  return (
    <div style={{position:'fixed',inset:0,zIndex:1200,background:'rgba(0,0,0,0.92)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'zoom-out'}}
      onClick={onClose}>
      <img src={src} alt="Payment proof"
        style={{maxWidth:'92vw',maxHeight:'88vh',objectFit:'contain',borderRadius:2,boxShadow:'0 8px 48px rgba(0,0,0,0.6)',cursor:'default'}}
        onClick={e=>e.stopPropagation()}/>
      <button onClick={onClose}
        style={{position:'absolute',top:16,right:16,width:40,height:40,borderRadius:'50%',background:'rgba(255,255,255,0.12)',border:'none',cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,lineHeight:1}}>
        ×
      </button>
      <div style={{position:'absolute',bottom:16,color:'rgba(255,255,255,0.4)',fontSize:11}}>Click anywhere or press Esc to close</div>
    </div>
  );
}

  const [done,setDone]=useState(false);
  const [uploadErr,setUploadErr]=useState('');
  const fileRef=useRef();

  useEffect(()=>{
    sb.from('customers').select('*').eq('id',customerId).maybeSingle()
      .then(({data,error})=>{
        if(error||!data) setNotFound(true);
        else setCustomer(data);
        setPageLoading(false);
      });
  },[customerId]);

  async function handleFile(e){
    const file=e.target.files[0];if(!file) return;
    if(file.size>8*1024*1024){setUploadErr('Image must be under 8MB.');return;}
    setUploadErr('');setUploading(true);
    try{
      const dataUrl=await compressImage(file);
      const blob=await fetch(dataUrl).then(r=>r.blob());
      const path=`${customerId}/proof.jpg`;
      const {error:upErr}=await sb.storage.from('proofs').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
      if(upErr) throw upErr;
      const {data:urlData}=sb.storage.from('proofs').getPublicUrl(path);
      const {error:dbErr}=await sb.from('customers').update({
        payment_proof_url:urlData.publicUrl,
        payment_proof_at:new Date().toISOString(),
        updated_at:new Date().toISOString(),
      }).eq('id',customerId);
      if(dbErr) throw dbErr;
      setDone(true);
    }catch(e){setUploadErr('Upload failed: '+e.message);}
    setUploading(false);
  }

  /* ── Loading ── */
  if(pageLoading) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <Spinner/>
    </div>
  );

  /* ── Not found ── */
  if(notFound) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:20,fontFamily:'Hanken Grotesk,system-ui,sans-serif'}}>
      <div style={{textAlign:'center',maxWidth:400}}>
        
        <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:25,fontWeight:500,letterSpacing:'-.01em',color:C.text,marginBottom:8}}>Order not found</div>
        <div style={{fontSize:13,color:C.textDim,lineHeight:1.7}}>This link may be invalid or expired. Please contact us for help.</div>
      </div>
    </div>
  );

  /* ── Success ── */
  if(done) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:20,fontFamily:'Hanken Grotesk,system-ui,sans-serif'}}>
      <div style={{textAlign:'center',maxWidth:420}}>
        <div style={{width:80,height:80,borderRadius:'50%',background:C.terraDim,border:`1.5px solid ${C.terra}`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 22px'}}><ICheck size={34} color={C.terra}/></div>
        <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:30,fontWeight:500,letterSpacing:'-.01em',color:C.text,marginBottom:10}}>Thank you, {customer?.name}!</div>
        <div style={{fontSize:13.5,color:C.textMid,lineHeight:1.75}}>Your payment screenshot has been received. We'll process your order and reach out when it's ready for pickup.</div>
      </div>
    </div>
  );

  const alreadyUploaded=!!customer?.payment_proof_url;

  /* ── Upload page ── */
  return (
    <div style={{minHeight:'100vh',background:C.bg,fontFamily:'Hanken Grotesk,system-ui,sans-serif'}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>

      {/* Navbar */}
      <div style={{background:C.text,padding:'14px 24px',display:'flex',alignItems:'center'}}>
        <div style={{fontFamily:'Newsreader,Georgia,serif',fontWeight:600,fontSize:20,letterSpacing:'-.01em',color:'#fff'}}>OrderTrack</div>
      </div>

      <div style={{maxWidth:500,margin:'0 auto',padding:'32px 20px 60px'}}>

        {/* Greeting */}
        <div style={{marginBottom:24}}>
          <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:30,fontWeight:500,letterSpacing:'-.02em',color:C.text,marginBottom:6}}>
            Hi {customer.name}
          </div>
          <div style={{fontSize:13,color:C.textMid,lineHeight:1.75}}>
            {alreadyUploaded
              ?'We already have your payment screenshot — you can upload a new one below if needed.'
              :'Please upload your payment screenshot to confirm your order.'}
          </div>
        </div>

        {/* Order Summary */}
        <Card>
          <SecTitle icon={IBox}>Your Order ({(customer.orders||[]).length} item{(customer.orders||[]).length!==1?'s':''})</SecTitle>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {(customer.orders||[]).map((o,i)=>(
              <div key={i} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:2,padding:'12px 14px',fontSize:12.5,color:C.textMid,minWidth:128}}>
                <div style={{fontWeight:600,color:C.textDim,fontSize:9.5,textTransform:'uppercase',letterSpacing:'0.12em',marginBottom:9}}>Item {i+1}</div>
                {o.colour&&<div style={{display:'flex',justifyContent:'space-between',gap:16,marginBottom:5}}><span style={{color:C.textDim}}>Colour</span><span style={{color:C.text}}>{o.colour}</span></div>}
                {o.size  &&<div style={{display:'flex',justifyContent:'space-between',gap:16,marginBottom:5}}><span style={{color:C.textDim}}>Size</span><span style={{color:C.text}}>{o.size}</span></div>}
                {o.style &&<div style={{display:'flex',justifyContent:'space-between',gap:16}}><span style={{color:C.textDim}}>Style</span><span style={{color:C.text}}>{o.style}</span></div>}
              </div>
            ))}
          </div>
        </Card>

        {/* Existing proof preview */}
        {alreadyUploaded&&(
          <Card>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,color:'#3F7D5A',fontSize:12,fontWeight:500}}>
              <ICheck size={14} color={C.sage}/> Screenshot already on file
            </div>
            <img src={customer.payment_proof_url} alt="Uploaded proof"
              style={{width:'100%',maxHeight:220,objectFit:'contain',borderRadius:2,border:`1px solid ${C.border}`,background:C.bg2}}/>
            {customer.payment_proof_at&&<div style={{fontSize:10,color:C.textDim,marginTop:8}}>Uploaded {fmtDate(customer.payment_proof_at)}</div>}
          </Card>
        )}

        {/* Upload card */}
        <Card>
          <input type="file" ref={fileRef} accept="image/*" style={{display:'none'}} onChange={handleFile}/>

          {uploadErr&&(
            <div style={{background:'#fee2e2',border:'1px solid #fca5a5',color:'#991b1b',padding:'10px 14px',borderRadius:2,fontSize:12,marginBottom:14,display:'flex',alignItems:'center',gap:8}}>
              <IAlert size={13} color="#991b1b"/> {uploadErr}
            </div>
          )}

          <div style={{border:`1.5px dashed ${C.border}`,borderRadius:2,padding:'28px 16px',textAlign:'center',background:C.bg2,marginBottom:14,cursor:'pointer',transition:'all 0.2s'}}
            onClick={()=>!uploading&&fileRef.current.click()}>
            <IImg size={28} style={{margin:'0 auto 10px',color:C.textDim}}/>
            <div style={{fontSize:13,color:C.textMid,fontWeight:500}}>
              {alreadyUploaded?'Tap to upload a new screenshot':'Tap to choose your screenshot'}
            </div>
            <div style={{fontSize:11,color:C.textDim,marginTop:4}}>JPG or PNG · auto-compressed</div>
          </div>

          <button onClick={()=>fileRef.current.click()} disabled={uploading}
            style={{width:'100%',background:C.terra,color:'#fff',border:'none',padding:'14px',borderRadius:2,fontFamily:'Hanken Grotesk,system-ui,sans-serif',fontSize:14,fontWeight:600,letterSpacing:'.01em',cursor:uploading?'not-allowed':'pointer',opacity:uploading?0.7:1,display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
            {uploading?<><Spinner/> Uploading…</>:<><IUpload size={16}/> {alreadyUploaded?'Replace Screenshot':'Upload Payment Screenshot'}</>}
          </button>
        </Card>

      </div>
    </div>
  );
}

/* ══ FINANCE VIEW ════════════════════════════════════════════════════ */
function FinanceView({customers,expenses,onAddExpense,onDeleteExpense,onExport}){
  const [finTab,setFinTab]=useState('overview');
  const [showAdd,setShowAdd]=useState(false);
  const [newExp,setNewExp]=useState({date:new Date().toISOString().slice(0,10),category:'Materials',description:'',amount:''});
  const [saving,setSaving]=useState(false);

  /* ── Calculations ── */
  const collected  = customers.filter(c=>['paid','ready','collected'].includes(c.status));
  const invoiced   = customers.filter(c=>c.status==='invoice_sent');
  const totalRev   = collected.reduce((s,c)=>s+Number(c.price||0),0);
  const totalCost  = customers.reduce((s,c)=>s+Number(c.cost||0),0);
  const totalExp   = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const netProfit  = totalRev-totalCost-totalExp;
  const outstanding= invoiced.reduce((s,c)=>s+Number(c.price||0),0);

  /* ── Running balance ── */
  const allTxns=[
    ...collected.filter(c=>Number(c.price||0)>0).map(c=>({date:c.updated_at||c.created_at,label:`${c.name}`,amount:Number(c.price||0),type:'income'})),
    ...expenses.map(e=>({date:e.date+'T00:00:00',label:`${e.description} (${e.category})`,amount:-Number(e.amount||0),type:'expense'})),
    ...customers.filter(c=>Number(c.cost||0)>0).map(c=>({date:c.created_at,label:`Cost: ${c.name}`,amount:-Number(c.cost||0),type:'cost'})),
  ].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let running=0;
  const balanceRows=allTxns.map(t=>{running+=t.amount;return{...t,balance:running};}).reverse();

  async function addExpense(){
    if(!newExp.description||!newExp.amount){alert('Please fill in description and amount.');return;}
    setSaving(true);
    await onAddExpense({...newExp,amount:parseFloat(newExp.amount)});
    setNewExp({date:new Date().toISOString().slice(0,10),category:'Materials',description:'',amount:''});
    setShowAdd(false);setSaving(false);
  }

  const SUMMARY_CARDS=[
    {label:'Total Revenue',   value:totalRev,    active:true, sub:`${collected.length} collected order${collected.length!==1?'s':''}`},
    {label:'Outstanding',     value:outstanding, active:true, sub:`${invoiced.length} awaiting payment`},
    {label:'Total Expenses',  value:totalExp+totalCost,active:false,sub:`${expenses.length} log entries + order costs`},
    {label:'Net Profit',      value:netProfit,   active:false,sub:'Revenue − costs − expenses'},
  ];

  const FIN_TABS=[['overview','Per-order Breakdown'],['expenses','Expenses Log'],['balance','Running Balance']];

  return (
    <div style={{maxWidth:1060,margin:'0 auto',padding:'28px 20px 80px'}}>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:30,fontWeight:500,letterSpacing:'-.02em',color:C.text}}>Finance</div>
        <Btn variant="ghost" small onClick={onExport}><IDown size={13}/> Export to Excel</Btn>
      </div>

      {/* Summary Cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12,marginBottom:28}}>
        {SUMMARY_CARDS.map(s=>(
          <div key={s.label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:2,padding:'20px 22px'}}>
            <div style={{fontSize:10.5,letterSpacing:'.12em',textTransform:'uppercase',color:C.textDim,marginBottom:10}}>{s.label}</div>
            <div style={{fontFamily:FONT_SERIF,fontSize:30,fontWeight:500,letterSpacing:'-.03em',lineHeight:1,color:s.label==='Net Profit'&&netProfit<0?'#B23B3B':C.text}}>{fmt(s.value)}</div>
            <div style={{fontSize:12,color:C.textMid,marginTop:10}}>{s.sub}</div>
            {s.active&&<div style={{height:2,width:22,background:C.terra,marginTop:14}}/>}
          </div>
        ))}
      </div>

      {/* Sub-tabs */}
      <div style={{display:'flex',gap:0,marginBottom:20,borderBottom:`1px solid ${C.border}`}}>
        {FIN_TABS.map(([id,label])=>(
          <button key={id} onClick={()=>setFinTab(id)}
            style={{background:'transparent',border:'none',borderBottom:`2px solid ${finTab===id?C.terra:'transparent'}`,padding:'9px 18px',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:finTab===id?600:400,color:finTab===id?C.terra:C.textMid,marginBottom:-1,transition:'all 0.15s'}}>
            {label}
          </button>
        ))}
      </div>

      {/* ── Per-order Breakdown ── */}
      {finTab==='overview'&&(
        <Card>
          <SecTitle icon={IDollar}>Revenue &amp; Cost per Order</SecTitle>
          {customers.length===0?(
            <div style={{textAlign:'center',padding:'32px',color:C.textDim,fontSize:13}}>No orders yet.</div>
          ):(
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead>
                  <tr style={{background:C.bg2}}>
                    {['Customer','Items','Status','Selling Price','Order Cost','Margin','Margin %'].map(h=>(
                      <th key={h} style={{padding:'9px 12px',textAlign:'left',fontSize:10,fontWeight:600,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {customers.map((c,i)=>{
                    const p=Number(c.price||0),cost=Number(c.cost||0),margin=p-cost;
                    const pct=p>0?((margin/p)*100).toFixed(0):null;
                    const bg=i%2===0?C.card:C.surface;
                    return (
                      <tr key={c.id} style={{borderBottom:`1px solid ${C.border}`,background:bg}}>
                        <td style={{padding:'9px 12px',fontWeight:600,color:C.text}}>{c.name}</td>
                        <td style={{padding:'9px 12px',color:C.textMid,textAlign:'center'}}>{(c.orders||[]).length}</td>
                        <td style={{padding:'9px 12px'}}><StatusBadge status={c.status}/></td>
                        <td style={{padding:'9px 12px',fontFamily:'monospace',color:C.text}}>{p>0?fmt(p):<span style={{color:C.textDim}}>—</span>}</td>
                        <td style={{padding:'9px 12px',fontFamily:'monospace',color:C.text}}>{cost>0?fmt(cost):<span style={{color:C.textDim}}>—</span>}</td>
                        <td style={{padding:'9px 12px',fontFamily:'monospace',fontWeight:500,color:margin>0?'#3F7D5A':margin<0?'#B23B3B':C.textDim}}>{p>0||cost>0?fmt(margin):<span style={{color:C.textDim}}>—</span>}</td>
                        <td style={{padding:'9px 12px',fontFamily:'monospace',color:C.textMid}}>{pct!==null?`${pct}%`:'—'}</td>
                      </tr>
                    );
                  })}
                  <tr style={{background:C.bg2}}>
                    <td colSpan={3} style={{padding:'9px 12px',color:C.textMid,fontSize:11,textTransform:'uppercase',letterSpacing:'0.5px',fontWeight:600}}>Totals</td>

                        <td style={{padding:'9px 12px'}}>

}

/* ══ DASHBOARD VIEW ══════════════════════════════════════════════════ */
function DashboardView({customers,templates,search,setSearch,statusFilter,setStatusFilter,onOpenDetail,onDelete,onUpdateCustomer,onRefresh,refreshing,showToast}){
  const stats=STATUS_ORDER.reduce((a,s)=>({...a,[s]:customers.filter(c=>c.status===s).length}),{});
  const filtered=customers.filter(c=>{
    const q=search.toLowerCase();
    return(!q||c.name.toLowerCase().includes(q)||c.phone.includes(q))&&
           (statusFilter==='all'||c.status===statusFilter);
  });

  function exportCSV(){
    const rows=[['Name','Phone','Items','Colours','Sizes','Styles','Status','Notes','Added']];
    customers.forEach(c=>rows.push([
      c.name,`+${c.phone}`,(c.orders||[]).length,
      [...new Set((c.orders||[]).map(o=>o.colour).filter(Boolean))].join('; '),
      [...new Set((c.orders||[]).map(o=>o.size).filter(Boolean))].join('; '),
      [...new Set((c.orders||[]).map(o=>o.style).filter(Boolean))].join('; '),
      STATUSES[c.status]?.label,c.notes||'',fmtDate(c.created_at),
    ]));
    const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='orders.csv';a.click();showToast('CSV exported!');
  }

  const SCARDS=[
    {label:'Customers',   value:customers.length,    active:false},
    {label:'Invoice Sent',value:stats.invoice_sent,  active:true },
    {label:'Paid',        value:stats.paid,          active:false},
    {label:'Ready',       value:stats.ready,         active:true },
    {label:'Collected',   value:stats.collected,     active:false},
  ];

  return (
    <div style={{maxWidth:1180,margin:'0 auto',padding:'6px 32px 96px'}}>
      {/* Heading */}
      <div style={{marginBottom:30}}>
        <h1 style={{fontFamily:FONT_SERIF,fontSize:31,fontWeight:500,letterSpacing:'-.02em',color:C.text,lineHeight:1.1,margin:0}}>Orders</h1>
        <div style={{fontSize:13.5,color:C.textMid,marginTop:8}}>{customers.length} customer{customers.length!==1?'s':''} · {stats.invoice_sent} awaiting payment · {stats.ready} ready for pickup</div>
      </div>
      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:30}}>
        {SCARDS.map(s=>(
          <div key={s.label} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:2,padding:'20px 22px'}}>
            <div style={{fontFamily:FONT_SERIF,fontSize:35,fontWeight:500,letterSpacing:'-.03em',color:C.text,lineHeight:1}}>{s.value}</div>
            <div style={{fontSize:10.5,letterSpacing:'.12em',textTransform:'uppercase',color:C.textDim,marginTop:12}}>{s.label}</div>
            {s.active&&<div style={{height:2,width:22,background:C.terra,marginTop:14}}/>}
          </div>
        ))}
      </div>

      {/* Toolbar */}
      <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <ISearch size={13} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:C.textDim,pointerEvents:'none'}}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name or phone…"
            style={{width:'100%',background:C.card,border:`1px solid ${C.border}`,color:C.text,padding:'9px 12px 9px 32px',borderRadius:2,fontFamily:'inherit',fontSize:13,outline:'none'}}/>
        </div>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}
          style={{background:C.card,border:`1px solid ${C.border}`,color:C.textMid,padding:'9px 12px',borderRadius:2,fontFamily:'inherit',fontSize:13,cursor:'pointer',outline:'none'}}>
          <option value="all">All Statuses</option>
          {STATUS_ORDER.map(s=><option key={s} value={s}>{STATUSES[s].label}</option>)}
        </select>
        <Btn variant="ghost" small onClick={onRefresh} disabled={refreshing} sx={{whiteSpace:'nowrap'}}>
          <IRefresh size={13}/> {refreshing?'Refreshing…':'Refresh'}
        </Btn>
        <Btn variant="ghost" small onClick={exportCSV} sx={{whiteSpace:'nowrap'}}><IDown size={13}/> Export CSV</Btn>
      </div>

      {/* Table */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:2,overflow:'hidden',boxShadow:'none'}}>
        {filtered.length===0?(
          <div style={{textAlign:'center',padding:'64px 20px',color:C.textDim}}>
            <IBox size={38} style={{margin:'0 auto 14px',opacity:0.25}}/>
            <div style={{fontSize:15,fontWeight:600,color:C.textMid,marginBottom:4}}>{customers.length===0?'No orders yet':'No results found'}</div>
            <div style={{fontSize:12}}>{customers.length===0?'Go to Import to upload your Excel file':'Try adjusting your search or filter'}</div>
          </div>
        ):(
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr style={{background:C.bg2}}>
                  {['Customer','Phone','Items','Status','Invoice','Pickup','Added',''].map(h=>(
                    <th key={h} style={{padding:'15px 16px',textAlign:'left',fontSize:10,fontWeight:600,letterSpacing:'0.12em',textTransform:'uppercase',color:C.textDim,borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((c,i)=>{
                  const invMsg=buildMsg(templates.invoice,c);
                  const rdyMsg=buildMsg(templates.ready,c);
                  const canPickup=['paid','ready','collected'].includes(c.status);
                  const rowBg=i%2===0?C.card:C.surface;
                  return (
                    <tr key={c.id} style={{borderBottom:`1px solid ${C.border}`,background:rowBg,cursor:'pointer',transition:'background 0.12s'}}
                      onMouseEnter={e=>e.currentTarget.style.background=C.terraDim}
                      onMouseLeave={e=>e.currentTarget.style.background=rowBg}
                      onClick={()=>onOpenDetail(c.id)}>
                      <td style={{padding:'16px 16px',fontWeight:500,color:C.text,letterSpacing:'-.005em'}}>{c.name}</td>
                      <td style={{padding:'16px 16px',color:C.textMid,fontSize:13,fontVariantNumeric:'tabular-nums'}}>{c.phone?`+${c.phone}`:'—'}</td>
                      <td style={{padding:'16px 16px',color:C.textMid,textAlign:'center'}}>{(c.orders||[]).length}</td>
                      <td style={{padding:'16px 16px'}}><StatusBadge status={c.status}/></td>
                      <td style={{padding:'16px 16px'}} onClick={e=>e.stopPropagation()}>
                        <a href={c.phone?waLink(c.phone,invMsg):'#'} target="_blank" rel="noopener"
                          onClick={()=>{if(c.status==='new')onUpdateCustomer(c.id,{status:'invoice_sent',status_history:[...(c.status_history||[]),{status:'invoice_sent',date:new Date().toISOString()}]});}}
                          style={{display:'inline-flex',alignItems:'center',gap:5,color:C.terra,fontSize:12.5,fontWeight:500,textDecoration:'none',opacity:c.phone?1:0.35,pointerEvents:c.phone?'auto':'none'}}>
                          <ISend size={11}/> Send
                        </a>
                      </td>
                      <td style={{padding:'16px 16px'}} onClick={e=>e.stopPropagation()}>
                        {canPickup
                          ?<a href={waLink(c.phone,rdyMsg)} target="_blank" rel="noopener"
                              style={{display:'inline-flex',alignItems:'center',gap:5,color:C.terra,fontSize:12.5,fontWeight:500,textDecoration:'none'}}>
                              <IBox size={11}/> Send
                            </a>
                          :<span style={{color:C.textDim,fontSize:11}}>—</span>}
                      </td>
                      <td style={{padding:'16px 16px',color:C.textDim,fontSize:11,whiteSpace:'nowrap'}}>{fmtDate(c.created_at)}</td>
                      <td style={{padding:'16px 16px'}} onClick={e=>e.stopPropagation()}>
                        <button onClick={()=>{if(confirm(`Delete ${c.name}?`))onDelete(c.id);}}
                          style={{background:'transparent',border:'none',cursor:'pointer',color:C.textDim,padding:4,borderRadius:2,display:'flex',alignItems:'center'}}>
                          <ITrash size={13}/>
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {filtered.length>0&&<div style={{fontSize:11,color:C.textDim,marginTop:10,textAlign:'right'}}>Showing {filtered.length} of {customers.length} customers</div>}
    </div>
  );
}

/* ══ IMPORT VIEW ══════════════════════════════════════════════════════ */
function ImportView({onImport,onBack}){
  const [step,setStep]=useState('upload');
  const [headers,setHeaders]=useState([]);
  const [rawRows,setRawRows]=useState([]);
  const [colMap,setColMap]=useState({name:'',phone:'',colour:'',size:'',style:''});
  const [prefix,setPrefix]=useState('673');
  const [drag,setDrag]=useState(false);
  const [importing,setImporting]=useState(false);
  const [importMode,setImportMode]=useState('update_orders');
  const fileRef=useRef();
  const FIELDS=[
    {key:'name',label:'Customer Name ✱'},{key:'phone',label:'Phone Number ✱'},
    {key:'colour',label:'Shirt Colour'},{key:'size',label:'Size'},{key:'style',label:'Style / Sleeve'},
  ];
  const MODES=[
    {id:'update_orders',label:'Update existing orders',desc:'Replaces order items for existing customers. Keeps their status, notes & payment proof. Best for correcting mistakes.',recommended:true},
    {id:'add_new',label:'Add new customers only',desc:'Skips anyone already in the system. Only adds brand new phone numbers. Safe top-up.',recommended:false},
    {id:'merge_orders',label:'Add orders on top',desc:'Appends new order rows to existing customers. Use when customers have genuinely ordered additional items.',recommended:false},
  ];
  function autoIdx(key,hdrs){
    return hdrs.findIndex(h=>{
      const l=h.toLowerCase();
      if(key==='name')   return l.includes('name');
      if(key==='phone')  return l.includes('phone')||l.includes('mobile')||l.includes('no')||l.includes('number');
      if(key==='colour') return l.includes('colour')||l.includes('color');
      if(key==='size')   return l.includes('size');
      if(key==='style')  return l.includes('style')||l.includes('sleeve');
      return false;
    });
  }
  function handleFile(file){
    if(!file) return;
    const reader=new FileReader();
    reader.onerror=()=>alert('Could not read this file.');
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!json.length||!json[0]?.some(c=>c)){alert('No header row found.');return;}
        const hdrs=json[0].map(h=>String(h??'').trim());
        const rows=json.slice(1).filter(r=>r.some(c=>String(c).trim()));
        setHeaders(hdrs);setRawRows(rows);
        const auto={};
        FIELDS.forEach(f=>{const idx=autoIdx(f.key,hdrs);auto[f.key]=idx>=0?String(idx):'';});
        setColMap(auto);setStep('map');
      }catch(err){alert('Parse error: '+err.message);}
    };
    reader.readAsBinaryString(file);
  }
  async function doImport(){
    if(!colMap.name||!colMap.phone){alert('Name and Phone columns are required.');return;}
    setImporting(true);
    const groups={};
    rawRows.forEach(row=>{
      const phone=formatPhone(String(row[parseInt(colMap.phone)]??''),prefix);
      const name=String(row[parseInt(colMap.name)]??'').trim()||'Unknown';
      const key=phone||name;
      if(!groups[key]) groups[key]={name,phone,orders:[]};
      const o={};
      if(colMap.colour) o.colour=String(row[parseInt(colMap.colour)]??'').trim();
      if(colMap.size)   o.size  =String(row[parseInt(colMap.size)]  ??'').trim();
      if(colMap.style)  o.style =String(row[parseInt(colMap.style)] ??'').trim();
      groups[key].orders.push(o);
    });
    await onImport(Object.values(groups),importMode);
    setImporting(false);
  }
  return (
    <div style={{maxWidth:700,margin:'0 auto',padding:'24px 20px 80px'}}>
      <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'none',cursor:'pointer',color:C.textMid,fontFamily:'inherit',fontSize:13,marginBottom:20,padding:0}}><IBack size={14}/> Back</button>
      <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:30,fontWeight:500,letterSpacing:'-.02em',color:C.text,marginBottom:4}}>Import Orders</div>
      <div style={{fontSize:12,color:C.textDim,marginBottom:24}}>Upload Excel or CSV. Rows with the same phone number are grouped into one customer.</div>
      {step==='upload'&&(
        <Card>
          <input type="file" ref={fileRef} accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          <div style={{border:`1.5px dashed ${drag?C.terra:C.border2}`,borderRadius:2,padding:'52px 24px',textAlign:'center',cursor:'pointer',background:drag?C.terraDim:C.bg2,transition:'all 0.2s'}}
            onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
            onClick={()=>fileRef.current.click()}>
            <IUpload size={32} style={{margin:'0 auto 12px',color:C.textDim}}/>
            <div style={{fontWeight:600,fontSize:15,color:C.text,marginBottom:4}}>Drop your file here or click to browse</div>
            <div style={{fontSize:11,color:C.textDim}}>.xlsx · .xls · .csv</div>
          </div>
        </Card>
      )}
      {step==='map'&&(
        <Card>
          <SecTitle>Map Your Columns</SecTitle>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:12,marginBottom:20}}>
            {FIELDS.map(f=>(
              <div key={f.key}>
                <div style={{fontSize:10,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,fontWeight:600,marginBottom:5}}>{f.label}</div>
                <select value={colMap[f.key]} onChange={e=>setColMap({...colMap,[f.key]:e.target.value})}
                  style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,color:C.text,padding:'8px 10px',borderRadius:2,fontFamily:'inherit',fontSize:12,cursor:'pointer',outline:'none'}}>
                  <option value="">— skip —</option>
                  {headers.map((h,i)=><option key={i} value={String(i)}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10,paddingTop:14,borderTop:`1px solid ${C.border}`,marginBottom:20,flexWrap:'wrap'}}>
            <span style={{fontSize:12,color:C.textMid,fontWeight:500}}>Country code prefix:</span>
            <input value={prefix} onChange={e=>setPrefix(e.target.value.replace(/\D/g,''))} maxLength={5}
              style={{width:80,background:C.card,border:`1px solid ${C.border}`,color:C.text,padding:'7px 10px',borderRadius:2,fontFamily:'monospace',fontSize:13,outline:'none'}}/>
            <span style={{fontSize:11,color:C.textDim}}>Brunei: 673 · Singapore: 65 · Malaysia: 60</span>
          </div>
          <div style={{paddingTop:14,borderTop:`1px solid ${C.border}`,marginBottom:20}}>
            <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.8px',textTransform:'uppercase',color:C.textDim,marginBottom:10}}>If a customer already exists (matched by phone)</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {MODES.map(m=>(
                <div key={m.id} onClick={()=>setImportMode(m.id)}
                  style={{display:'flex',alignItems:'flex-start',gap:12,padding:'12px 14px',borderRadius:2,border:`1.5px solid ${importMode===m.id?C.terra:C.border}`,background:importMode===m.id?C.terraDim:C.surface,cursor:'pointer',transition:'all 0.15s'}}>
                  <div style={{width:16,height:16,borderRadius:'50%',border:`2px solid ${importMode===m.id?C.terra:C.border}`,background:importMode===m.id?C.terra:'transparent',flexShrink:0,marginTop:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {importMode===m.id&&<div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/>}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>

          <div style={{overflowX:'auto',borderRadius:2,border:`1px solid ${C.border}`,marginBottom:20}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
              <thead><tr style={{background:C.bg2}}>{['Name','Phone','Colour','Size','Style'].map(h=><th key={h} style={{padding:'7px 12px',textAlign:'left',color:C.textDim,fontWeight:600,fontSize:10,textTransform:'uppercase',letterSpacing:'0.8px',borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
              <tbody>{rawRows.slice(0,3).map((row,i)=>(
                <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                  {['name','phone','colour','size','style'].map(k=>(
                    <td key={k} style={{padding:'7px 12px',color:C.textMid}}>{colMap[k]!==''?String(row[parseInt(colMap[k])]??''):'—'}</td>
                  ))}
                </tr>
              ))}</tbody>
            </table>
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn variant="terra" onClick={doImport} disabled={importing}>
              {importing?<><Spinner/> Importing…</>:<><IUpload size={13}/> Import {rawRows.length} rows</>}
            </Btn>
            <Btn variant="ghost" onClick={()=>setStep('upload')}><IBack size={13}/> Back</Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

/* ══ DETAIL VIEW ══════════════════════════════════════════════════════ */
function DetailView({customer:c,templates,onClose,onUpdate,onUploadProof,onRemoveProof,showToast,onLightbox}){
  const [notes,setNotes]        =useState(c.notes||'');
  const [editNotes,setEditNotes]=useState(false);
  const [copied,setCopied]      =useState(null);
  const [proofUploading,setPU]  =useState(false);
  const fileRef=useRef();

  useEffect(()=>{setNotes(c.notes||'');},[c.id,c.notes]);

  const invMsg=buildMsg(templates.invoice,c);
  const rdyMsg=buildMsg(templates.ready,c);
  const sIdx  =STATUS_ORDER.indexOf(c.status);

  function copy(msg,key){navigator.clipboard.writeText(msg).catch(()=>{});setCopied(key);setTimeout(()=>setCopied(null),2000);}

  async function handleProof(e){
    const file=e.target.files[0];if(!file) return;
    if(file.size>8*1024*1024){showToast('Image must be under 8MB','error');return;}
    setPU(true);
    try{
      const url=await onUploadProof(c.id,file);
      await onUpdate({payment_proof_url:url,payment_proof_at:new Date().toISOString()});
      showToast('Payment proof saved');
    }catch(err){showToast('Upload failed: '+err.message,'error');}
    setPU(false);
  }

  async function removeProof(){
    if(!confirm('Remove payment proof?')) return;
    await onRemoveProof(c.id);
    await onUpdate({payment_proof_url:null,payment_proof_at:null});
    showToast('Proof removed');
  }

  function advance(){
    const next=STATUS_NEXT[c.status];if(!next) return;
    const history=[...(c.status_history||[]),{status:next,date:new Date().toISOString()}];
    onUpdate({status:next,status_history:history});
    showToast(`Status → ${STATUSES[next].label}`);
  }

  function revert(){
    const prev=STATUS_PREV[c.status];if(!prev) return;
    if(!confirm(`Revert from "${STATUSES[c.status].label}" back to "${STATUSES[prev].label}"?`)) return;
    const history=[...(c.status_history||[]),{status:prev,date:new Date().toISOString(),action:'reverted'}];
    onUpdate({status:prev,status_history:history});
    showToast(`Reverted to: ${STATUSES[prev].label}`);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>

      {/* ── Sticky header ── */}

        <div style={{minWidth:0}}>
          <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:22,fontWeight:500,letterSpacing:'-.01em',color:C.text,lineHeight:1.1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</div>
          <div style={{marginTop:5,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>

        </div>
        <button onClick={onClose}
          style={{width:32,height:32,borderRadius:'50%',background:C.bg2,border:`1px solid ${C.border}`,cursor:'pointer',color:C.textMid,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:18,lineHeight:1}}>
          ×

      </div>

      {/* ── Scrollable body ── */}
      <div style={{flex:1,overflowY:'auto',padding:'18px 20px 40px'}}>

        {/* Status actions */}
        <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
          {STATUS_NEXT[c.status]&&(
            <Btn variant="terra" small onClick={advance}><ICheck2 size={12}/> {STATUS_NEXT_LABEL[c.status]}</Btn>
          )}
          {STATUS_PREV[c.status]&&(
            <Btn variant="ghost" small onClick={revert}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>

/* ══ MAIN APP (authenticated) ════════════════════════════════════════ */
function MainApp({session,preview}){
  const [customers, setCustomers]=useState([]);
  const [templates, setTemplates]=useState(DEFAULT_TEMPLATES);
  const [expenses,  setExpenses] =useState([]);
  const [view,      setView]     =useState('dashboard');
  const [selectedId,setSelectedId]=useState(null);
  const [search,    setSearch]   =useState('');
  const [statusFilter,setStatusFilter]=useState('all');
  const [loading,   setLoading]  =useState(true);
  const [refreshing,setRefreshing]=useState(false);
  const [toast,     setToast]    =useState(null);
  const [lightboxUrl,setLightboxUrl]=useState(null);

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const loadAll=useCallback(async(quiet=false)=>{
    if(preview){setCustomers(MOCK_CUSTOMERS);setExpenses(MOCK_EXPENSES);setLoading(false);return;}
    if(!quiet) setLoading(true); else setRefreshing(true);
    try{
      const [{customers:c,templates:t},exp]=await Promise.all([dbLoadAll(),dbLoadExpenses()]);
      setCustomers(c); setTemplates(t); setExpenses(exp);
    }catch(err){showToast('Failed to load data: '+err.message,'error');}
    setLoading(false); setRefreshing(false);
  },[]);

  useEffect(()=>{
    loadAll();
    if(preview) return;
    // Real-time subscription
    const channel=sb.channel('realtime-customers')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'customers'},(p)=>{
        setCustomers(prev=>[p.new,...prev.filter(c=>c.id!==p.new.id)]);
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'customers'},(p)=>{
        setCustomers(prev=>prev.map(c=>c.id===p.new.id?p.new:c));
      })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'customers'},(p)=>{
        setCustomers(prev=>prev.filter(c=>c.id!==p.old.id));
      })
      .subscribe();
    return ()=>sb.removeChannel(channel);
  },[]);

  async function handleImport(groups,mode='update_orders'){
    try{
      const toInsert=[],toUpdate=[];
      groups.forEach(g=>{
        const ex=customers.find(c=>c.phone&&c.phone===g.phone);
        if(ex){
          if(mode==='add_new'){
            // skip — customer already exists
          } else if(mode==='update_orders'){
            // replace orders, keep status/notes/proof
            toUpdate.push({id:ex.id,orders:g.orders});
          } else {
            // merge_orders — append new rows on top
            toUpdate.push({id:ex.id,orders:[...(ex.orders||[]),...g.orders]});
          }
        } else {
          toInsert.push({name:g.name,phone:g.phone,orders:g.orders,status:'new',notes:'',status_history:[]});
        }
      });
      if(toInsert.length) await dbInsertCustomers(toInsert);
      for(const u of toUpdate) await dbUpdateCustomer(u.id,{orders:u.orders});
      const modeLabel=mode==='add_new'?'skipped existing':mode==='update_orders'?'orders updated':'orders merged';
      showToast(`${toInsert.length} new · ${toUpdate.length} ${modeLabel}`);
      setView('dashboard');
    }catch(err){showToast('Import failed: '+err.message,'error');}
  }

  async function handleUpdate(id,updates){
    try{
      await dbUpdateCustomer(id,updates);
      setCustomers(prev=>prev.map(c=>c.id===id?{...c,...updates,updated_at:new Date().toISOString()}:c));
    }catch(err){showToast('Update failed: '+err.message,'error');}
  }

  async function handleDelete(id){
    try{
      await dbDeleteCustomer(id);
      setCustomers(prev=>prev.filter(c=>c.id!==id));
      showToast('Customer deleted');
      if(selectedId===id) setView('dashboard');
    }catch(err){showToast('Delete failed: '+err.message,'error');}
  }

  async function handleUploadProof(customerId,file){
    return await dbUploadProof(customerId,file);
  }

  async function handleRemoveProof(customerId){
    await sb.storage.from('proofs').remove([`${customerId}/proof.jpg`]).catch(()=>{});
  }

  async function handleSaveTemplates(t){
    try{
      await dbSaveTemplates(t);
      setTemplates(t);
      showToast('Templates saved!');
      setView('dashboard');
    }catch(err){showToast('Save failed: '+err.message,'error');}
  }

  async function handleAddExpense(row){
    try{
      const saved=await dbAddExpense(row);
      setExpenses(prev=>[saved,...prev]);
      showToast('Expense added');
    }catch(err){showToast('Failed to add expense: '+err.message,'error');}
  }

  async function handleDeleteExpense(id){
    try{
      await dbDeleteExpense(id);
      setExpenses(prev=>prev.filter(e=>e.id!==id));
      showToast('Expense deleted');
    }catch(err){showToast('Failed to delete: '+err.message,'error');}
  }

  const selectedCustomer=customers.find(c=>c.id===selectedId);

  const NAV=[{id:'dashboard',label:'Dashboard'},{id:'import',label:'Import'},{id:'finance',label:'Finance'},{id:'templates',label:'Templates'}];

  if(loading) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontFamily:'Newsreader,Georgia,serif',fontSize:25,fontWeight:500,letterSpacing:'-.01em',color:C.text,marginBottom:16}}>Loading…</div>
        <Spinner/>
      </div>
    </div>
  );

  return (
    <div className="ot-shell" style={{background:C.bg,color:C.text,fontFamily:'Hanken Grotesk,system-ui,sans-serif'}}>
      <style>{`
        @keyframes spin{to{transform:rotate(360deg)}}
        .ot-shell{display:flex;min-height:100vh}
        .ot-side{width:218px;flex-shrink:0;background:#fff;border-right:1px solid ${C.border};position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:30px 0}
        .ot-brand{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:22px;letter-spacing:-.015em;color:${C.text};padding:0 28px;margin-bottom:36px;cursor:pointer;line-height:1}
        .ot-nav{display:flex;flex-direction:column}
        .ot-navitem{font-family:inherit;font-size:13.5px;letter-spacing:.005em;padding:11px 28px;cursor:pointer;border:none;border-left:2px solid transparent;background-color:transparent;color:${C.textMid};text-align:left;transition:color .15s}
        .ot-navitem:hover{color:${C.text}}
        .ot-navitem.active{color:${C.text};font-weight:500;border-left-color:${C.terra};background-color:${C.terraDim}}
        .ot-foot{margin-top:auto;padding:0 28px;display:flex;align-items:center;gap:10px}
        .ot-email{font-size:11.5px;color:${C.textDim};overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .ot-signout{background:transparent;border:none;cursor:pointer;color:${C.textDim};padding:4px;display:flex;align-items:center}
        .ot-signout:hover{color:${C.text}}
        .ot-logo-mob{display:none}
        .ot-main{flex:1;min-width:0;display:flex;flex-direction:column}
        .ot-topbar{position:sticky;top:0;z-index:40;height:70px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding:0 32px;background:rgba(250,250,249,.82);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px)}
        .ot-logo{width:52px;height:52px;object-fit:contain;display:block}
        .ot-views{flex:1;min-width:0}
        @media(max-width:859px){
          .ot-shell{flex-direction:column}
          .ot-side{width:100%;height:auto;position:sticky;top:0;z-index:50;flex-direction:row;align-items:center;padding:0 14px;height:54px;border-right:none;border-bottom:1px solid ${C.border};gap:4px}
          .ot-brand{margin:0 6px 0 2px;font-size:18px;padding:0;flex-shrink:0}
          .ot-nav{flex-direction:row;flex:1;overflow-x:auto;gap:2px}
          .ot-navitem{padding:8px 12px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
          .ot-navitem.active{border-left:none;border-bottom-color:${C.terra};background-color:transparent}
          .ot-foot{margin:0;padding:0 4px;flex-shrink:0}
          .ot-email{display:none}
          .ot-logo-mob{display:block;width:38px;height:38px;object-fit:contain;flex-shrink:0;margin-left:2px}
          .ot-topbar{display:none}
        }
      `}</style>

      {/* Sidebar / top nav */}
      <aside className="ot-side">
        <div className="ot-brand" onClick={()=>setView('dashboard')}>OrderTrack</div>
        <nav className="ot-nav">
          {NAV.map(n=>(
            <button key={n.id} className={'ot-navitem'+(view===n.id||(n.id==='dashboard'&&view==='detail')?' active':'')} onClick={()=>setView(n.id)}>{n.label}</button>

          {toast.msg}
        </div>
      )}

      {/* Main views — dashboard always renders so it shows behind the detail drawer */}
      {(view==='dashboard'||view==='detail')&&<DashboardView customers={customers} templates={templates} search={search} setSearch={setSearch} statusFilter={statusFilter} setStatusFilter={setStatusFilter} onOpenDetail={id=>{setSelectedId(id);setView('detail');}} onDelete={handleDelete} onUpdateCustomer={handleUpdate} onRefresh={()=>loadAll(true)} refreshing={refreshing} showToast={showToast}/>}
      {view==='import'   &&<ImportView onBack={()=>setView('dashboard')} onImport={handleImport}/>}
      {view==='finance'  &&<FinanceView customers={customers} expenses={expenses} onAddExpense={handleAddExpense} onDeleteExpense={handleDeleteExpense} onExport={()=>exportToExcel(customers,expenses)}/>}
      {view==='templates'&&<TemplatesView templates={templates} onBack={()=>setView('dashboard')} onSave={handleSaveTemplates}/>}

      {/* Detail drawer — slides in from the right over the dashboard */}
      {view==='detail'&&selectedCustomer&&(
        <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',pointerEvents:'auto'}}>
          {/* Backdrop */}
          <div style={{flex:1,background:'rgba(28,24,22,0.45)',backdropFilter:'blur(3px)',cursor:'pointer'}} onClick={()=>setView('dashboard')}/>

            <DetailView
              customer={selectedCustomer}
              templates={templates}
              onClose={()=>setView('dashboard')}
              onUpdate={u=>handleUpdate(selectedId,u)}
              onUploadProof={handleUploadProof}
              onRemoveProof={handleRemoveProof}
              showToast={showToast}
              onLightbox={setLightboxUrl}
            />
          </div>
        </div>
      )}

      {/* Lightbox */}
      {lightboxUrl&&<Lightbox src={lightboxUrl} onClose={()=>setLightboxUrl(null)}/>}
        </div>{/* ot-views */}
      </div>{/* ot-main */}
    </div>
  );
}

/* ══ APP ROOT (handles auth) ══════════════════════════════════════════ */
function App(){
  const [session,setSession]=useState(undefined);
  const params=new URLSearchParams(window.location.search);
  const uploadId=params.get('upload');
  const preview=params.get('preview');

  useEffect(()=>{
    if(uploadId||preview) return; // skip auth flow for upload + preview pages
    sb.auth.getSession().then(({data:{session}})=>setSession(session));
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setSession(session));
    return ()=>subscription.unsubscribe();
  },[uploadId]);

  // Customer upload page — no login required
  if(uploadId) return <CustomerUploadPage customerId={uploadId}/>;

  // Preview/demo mode — mock data, no backend
  if(preview) return <MainApp session={{user:{email:'amal@studio.bn'}}} preview/>;

  if(session===undefined) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <Spinner/>
    </div>
  );
  if(!session) return <LoginView/>;
  return <MainApp session={session}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
